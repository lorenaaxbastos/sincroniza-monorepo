name: PR Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Get code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment and install dependencies
        uses: ./.github/actions/setup-monorepo

      - name: Verify Changeset presence if packages changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | grep -q '^packages/'; then
            echo "Changes detected in packages. Verifying Changeset..."
            pnpm changeset status --since=origin/${{ github.base_ref }}
          else
            echo "No changes detected in packages. Skipping Changeset verification."
          fi
        shell: bash

      - name: Generate dynamic matrix with semantic prefixing
        id: set-matrix
        run: |
          PACKAGES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }} | grep -q '^packages/' && echo 'true' || echo 'false')
          CHANGED_APPS=()

          while IFS= read -r c_file; do
            app_dir=$(dirname "$c_file")

            if [ "$PACKAGES_CHANGED" = "true" ] || git diff --name-only origin/${{ github.base_ref }} | grep -q "^${app_dir}/"; then
              rel_path=${app_dir#apps/}

              if [[ "$rel_path" == clients/* ]]; then
                clean_path=${rel_path#clients/}
                matrix_name=$(echo "$clean_path" | tr '/' '-')
                cf_project="cliente-${matrix_name}"
              else
                matrix_name=$(echo "$rel_path" | tr '/' '-')
                cf_project="sincroniza-${matrix_name}"
              fi

              CHANGED_APPS+=("{\"name\":\"$cf_project\",\"path\":\"$app_dir\"}")
            fi
          done < <(find apps -name package.json -not -path "*/node_modules/*")

          if [ ${#CHANGED_APPS[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            IFS=,
            echo "matrix={\"include\":[${CHANGED_APPS[*]}]}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

  validate-and-preview:
    name: Build and Preview
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up environment and install dependencies
        uses: ./.github/actions/setup-monorepo

      - name: Run quality check (lint & typecheck)
        run: pnpm turbo run lint typecheck --filter=./${{ matrix.path }}...

      - name: Run unit tests
        run: pnpm turbo run test --filter=./${{ matrix.path }}...

      - name: Build application
        run: pnpm turbo run build --filter=./${{ matrix.path }}

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ matrix.name }}
          directory: ${{ matrix.path }}/dist
          gitBranch: ${{ github.head_ref }}
